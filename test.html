<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>One‑Word Access</title>
  <style>
    :root {
      --bg: #121213;
      --tile: #3a3a3c;
      --text: #ffffff;
      --correct: #538d4e;
      --border: #565758;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .container {
      text-align: center;
      max-width: 400px;
      width: 100%;
      padding: 20px;
    }

    h1 {
      margin-bottom: 20px;
      font-size: 1.5rem;
      letter-spacing: 1px;
    }

    .row {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-bottom: 20px;
    }

    .tile {
      width: 50px;
      height: 50px;
      border: 2px solid var(--border);
      background: var(--tile);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      font-weight: bold;
      text-transform: uppercase;
    }

    .tile.correct {
      background: var(--correct);
      border-color: var(--correct);
    }

    input {
      margin-top: 10px;
      padding: 10px;
      width: 100%;
      font-size: 1rem;
      text-transform: uppercase;
      background: #1a1a1b;
      color: var(--text);
      border: 1px solid var(--border);
      outline: none;
    }

    input::placeholder {
      text-transform: none;
    }

    .info {
      margin-top: 25px;
      padding: 15px;
      background: #1a1a1b;
      border: 1px solid var(--border);
      display: none;
    }

    .shake {
      animation: shake 0.4s;
    }

    @keyframes shake {
      0% { transform: translateX(0); }
      25% { transform: translateX(-5px); }
      50% { transform: translateX(5px); }
      75% { transform: translateX(-5px); }
      100% { transform: translateX(0); }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Enter the word</h1>

    <div class="row" id="tiles"></div>

    <input
      id="wordInput"
      type="text"
      placeholder="Type the password and press Enter"
      autocomplete="off"
    />

    <div class="info" id="secretInfo">
      <h2>Access granted ✅</h2>
      <p>This information is only visible when the correct word is entered.</p>
      <p>You can put anything here: text, links, images, or even another app.</p>
    </div>
  </div>

  <script>
    const SECRET_WORD = "APPLE"; // must be exactly 5 letters
    const tilesContainer = document.getElementById("tiles");
    const input = document.getElementById("wordInput");
    const info = document.getElementById("secretInfo");

    // create tiles
    for (let i = 0; i < SECRET_WORD.length; i++) {
      const tile = document.createElement("div");
      tile.className = "tile";
      tilesContainer.appendChild(tile);
    }

    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        checkWord();
      }
    });

    function checkWord() {
      const guess = input.value.toUpperCase();
      const tiles = document.querySelectorAll(".tile");

      // reset
      tiles.forEach(t => {
        t.textContent = "";
        t.classList.remove("correct");
      });
      info.style.display = "none";

      if (guess !== SECRET_WORD) {
        tilesContainer.classList.remove("shake");
        void tilesContainer.offsetWidth; // restart animation
        tilesContainer.classList.add("shake");
        return;
      }

      // correct word
      for (let i = 0; i < SECRET_WORD.length; i++) {
        tiles[i].textContent = SECRET_WORD[i];
        tiles[i].classList.add("correct");
      }

      info.style.display = "block";
      input.disabled = true;
    }
  </script>
</body>
</html>
